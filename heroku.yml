build:
  docker:
    web: Dockerfile.heroku

release:
  image: web
  command:
    - alembic upgrade head

run:
  web: gunicorn main:app --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-4} --worker-class uvicorn.workers.UvicornWorker --timeout 120
  worker: celery -A app.tasks worker --loglevel=info
