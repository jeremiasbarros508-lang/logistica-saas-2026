{% extends 'base.html' %}
{% block title %}{{ 'Edit' if shipment else 'New' }} Shipment – Tech Logistics{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="fas fa-{{ 'edit' if shipment else 'plus' }} me-2"></i>
                    {{ 'Edit Shipment' if shipment else 'New Shipment' }}
                </h5>
            </div>
            <div class="card-body">
                <form method="post"
                      action="{{ url_for('shipments.edit', shipment_id=shipment.id) if shipment else url_for('shipments.new') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Origin <span class="text-danger">*</span></label>
                            <input type="text" name="origin" class="form-control" required
                                   value="{{ shipment.origin if shipment else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Destination <span class="text-danger">*</span></label>
                            <input type="text" name="destination" class="form-control" required
                                   value="{{ shipment.destination if shipment else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Weight (kg)</label>
                            <input type="number" name="weight_kg" class="form-control" step="0.1" min="0"
                                   value="{{ shipment.weight_kg if shipment and shipment.weight_kg else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Volume (m³)</label>
                            <input type="number" name="volume_m3" class="form-control" step="0.01" min="0"
                                   value="{{ shipment.volume_m3 if shipment and shipment.volume_m3 else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Estimated Delivery</label>
                            <input type="date" name="estimated_delivery" class="form-control"
                                   value="{{ shipment.estimated_delivery.strftime('%Y-%m-%d') if shipment and shipment.estimated_delivery else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Assign Vehicle</label>
                            <select name="vehicle_id" class="form-select">
                                <option value="">No vehicle assigned</option>
                                {% for v in vehicles %}
                                <option value="{{ v.id }}"
                                    {% if shipment and shipment.vehicle_id == v.id %}selected{% endif %}>
                                    {{ v.plate }} – {{ v.brand }} {{ v.model }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        {% if current_user.is_manager() %}
                        <div class="col-md-6">
                            <label class="form-label">Assign To</label>
                            <select name="assigned_to" class="form-select">
                                {% for u in users %}
                                <option value="{{ u.id }}"
                                    {% if shipment and shipment.assigned_to == u.id %}selected{% endif %}>
                                    {{ u.name }} ({{ u.role }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        {% endif %}
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="3">{{ shipment.description if shipment else '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>
                            {{ 'Update' if shipment else 'Create' }} Shipment
                        </button>
                        <a href="{{ url_for('shipments.detail', shipment_id=shipment.id) if shipment else url_for('shipments.index') }}"
                           class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
