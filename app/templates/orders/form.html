{% extends 'base.html' %}
{% block title %}{{ 'Edit' if order else 'New' }} Order – Tech Logistics{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="fas fa-{{ 'edit' if order else 'plus' }} me-2"></i>
                    {{ 'Edit Order' if order else 'New Order' }}
                </h5>
            </div>
            <div class="card-body">
                <form method="post"
                      action="{{ url_for('orders.edit', order_id=order.id) if order else url_for('orders.new') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Customer Name <span class="text-danger">*</span></label>
                            <input type="text" name="customer_name" class="form-control" required
                                   value="{{ order.customer_name if order else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Customer Email</label>
                            <input type="email" name="customer_email" class="form-control"
                                   value="{{ order.customer_email if order else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Customer Phone</label>
                            <input type="tel" name="customer_phone" class="form-control"
                                   value="{{ order.customer_phone if order else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Priority</label>
                            <select name="priority" class="form-select">
                                {% for p in priority_choices %}
                                <option value="{{ p }}"
                                    {% if order and order.priority == p %}selected
                                    {% elif not order and p == 'normal' %}selected{% endif %}>
                                    {{ p|title }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Pickup Address <span class="text-danger">*</span></label>
                            <input type="text" name="pickup_address" class="form-control" required
                                   value="{{ order.pickup_address if order else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Delivery Address <span class="text-danger">*</span></label>
                            <input type="text" name="delivery_address" class="form-control" required
                                   value="{{ order.delivery_address if order else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Total Value (R$)</label>
                            <input type="number" name="total_value" class="form-control"
                                   step="0.01" min="0"
                                   value="{{ order.total_value if order else '' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" class="form-control" rows="3">{{ order.notes if order else '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>
                            {{ 'Update' if order else 'Create' }} Order
                        </button>
                        <a href="{{ url_for('orders.detail', order_id=order.id) if order else url_for('orders.index') }}"
                           class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
